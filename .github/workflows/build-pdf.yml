name: Build and Validate PDFs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Compile Documents
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install TeX Live Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-portuguese

      - name: Run Test Suite (SDD Gate)
        run: python -m unittest discover tests/

      - name: Compile Official PDFs
        run: |
          mkdir -p dist
          # Compilação de documentos do repositório em dist/
          for doc in tests/test_base.tex; do
            if [ -f "$doc" ]; then
              pdflatex -interaction=nonstopmode -halt-on-error -output-directory=dist "$doc"
              pdflatex -interaction=nonstopmode -halt-on-error -output-directory=dist "$doc"
            fi
          done

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-documents
          path: dist/*.pdf
          if-no-files-found: error
          retention-days: 30
